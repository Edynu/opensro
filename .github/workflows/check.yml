name: source-check

on:
  push:
  pull_request:

jobs:
  source-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # check:server runs the Go gates: tidy, gofmt, vet, tests, race subset, govulncheck.
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - run: pnpm install --frozen-lockfile
      - run: pnpm check source

  # The asset pipeline and asset-dependent suites consume a locally extracted,
  # licensed v1.150 client and are intentionally not run on hosted machines.
